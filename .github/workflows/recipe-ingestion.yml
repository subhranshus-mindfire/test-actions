name: Recipe Validation & Ingestion

on:
  push:
    branches:
      - main
    paths:
      - "**/*.recipe.json"

jobs:
  recipe-ingestion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Playwright validation
      # Uncomment when Playwright tests are available
      # - name: Run Playwright validation
      #   run: npx playwright test

      - name: Find changed recipe files
        id: recipes
        shell: bash
        run: |
          git diff --name-only HEAD^ HEAD -- '*.recipe.json' > changed-recipes.txt

          echo "Changed recipe files:"
          cat changed-recipes.txt

          if [ ! -s changed-recipes.txt ]; then
            echo "No recipe files changed."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and ingest recipes
        if: steps.recipes.outputs.found == 'true'
        env:
          API_URL: ${{ secrets.INGESTION_API_URL }}
          API_TOKEN: ${{ secrets.INGESTION_API_TOKEN }}
        shell: bash
        run: |
          set -e

          while IFS= read -r file; do

            echo ""
            echo "======================================"
            echo "Processing: $file"
            echo "======================================"

            # ----------------------------------------
            # 1. Upload recipe
            # ----------------------------------------

            echo "Uploading recipe..."

            upload_response=$(curl -sS \
              -X POST "$API_URL/api/v1/upload" \
              -H "Authorization: Bearer $API_TOKEN" \
              -F "files=@$file" \
              -w "\nHTTP_STATUS:%{http_code}")

            upload_status=$(echo "$upload_response" | sed -n 's/HTTP_STATUS://p')
            upload_body=$(echo "$upload_response" | sed '/HTTP_STATUS:/d')

            echo "Upload HTTP status: $upload_status"
            echo "Upload response:"
            echo "$upload_body" | jq . 2>/dev/null || echo "$upload_body"

            if [ "$upload_status" -lt 200 ] || [ "$upload_status" -ge 300 ]; then
              echo ""
              echo "======================================"
              echo "UPLOAD FAILED"
              echo "Recipe: $file"
              echo "HTTP Status: $upload_status"
              echo "======================================"
              exit 1
            fi

            upload_id=$(echo "$upload_body" | jq -r '.upload_id')

            if [ -z "$upload_id" ] || [ "$upload_id" = "null" ]; then
              echo "ERROR: upload_id was not returned."
              exit 1
            fi

            echo "Upload ID: $upload_id"

            # ----------------------------------------
            # 2. Validate recipe
            # ----------------------------------------

            echo "Validating recipe..."

            validate_response=$(curl -sS \
              -X POST "$API_URL/api/v1/validate" \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"upload_id\":\"$upload_id\"}" \
              -w "\nHTTP_STATUS:%{http_code}")

            validate_status=$(echo "$validate_response" | sed -n 's/HTTP_STATUS://p')
            validate_body=$(echo "$validate_response" | sed '/HTTP_STATUS:/d')

            echo "Validation HTTP status: $validate_status"
            echo "Validation response:"
            echo "$validate_body" | jq . 2>/dev/null || echo "$validate_body"

            if [ "$validate_status" -lt 200 ] || [ "$validate_status" -ge 300 ]; then
              echo "Validation API request failed."
              exit 1
            fi

            can_ingest=$(echo "$validate_body" | jq -r '.can_ingest')

            if [ "$can_ingest" != "true" ]; then
              echo ""
              echo "======================================"
              echo "RECIPE VALIDATION FAILED"
              echo "Recipe: $file"
              echo "Upload ID: $upload_id"
              echo "======================================"

              echo "$validate_body" | jq '.errors // .'

              exit 1
            fi

            echo "Validation passed."

            # ----------------------------------------
            # 3. Start ingestion
            # ----------------------------------------

            echo "Starting ingestion..."

            ingest_response=$(curl -sS \
              -X POST "$API_URL/api/v1/ingest" \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"upload_id\":\"$upload_id\"}" \
              -w "\nHTTP_STATUS:%{http_code}")

            ingest_status=$(echo "$ingest_response" | sed -n 's/HTTP_STATUS://p')
            ingest_body=$(echo "$ingest_response" | sed '/HTTP_STATUS:/d')

            echo "Ingestion HTTP status: $ingest_status"
            echo "Ingestion response:"
            echo "$ingest_body" | jq . 2>/dev/null || echo "$ingest_body"

            if [ "$ingest_status" -lt 200 ] || [ "$ingest_status" -ge 300 ]; then
              echo "Ingestion API request failed."
              exit 1
            fi

            job_id=$(echo "$ingest_body" | jq -r '.job_id')

            if [ -z "$job_id" ] || [ "$job_id" = "null" ]; then
              echo "ERROR: job_id was not returned."
              exit 1
            fi

            echo ""
            echo "======================================"
            echo "INGESTION STARTED"
            echo "Recipe: $file"
            echo "Upload ID: $upload_id"
            echo "Job ID: $job_id"
            echo "======================================"

          done < changed-recipes.txt
